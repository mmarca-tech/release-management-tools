name: Package Release Management Tools

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run unit tests
        run: dotnet test tests/ReleaseTools.Tests/ReleaseTools.Tests.csproj --configuration Release

      - name: Publish Linux package
        run: dotnet publish src/ReleaseTools/ReleaseTools.csproj --configuration Release --runtime linux-x64 --self-contained true -p:PublishSingleFile=true --output publish

      - name: Archive package
        run: tar -czf release-management-tools-linux-x64.tar.gz -C publish .

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release-management-tools-linux-x64.tar.gz --clobber